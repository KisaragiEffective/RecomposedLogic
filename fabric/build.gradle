plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    gametestImplementation sourceSets.main.output
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    mods {
        "${mod_id}-gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gametest {
            server()
            setConfigName('Fabric GameTest Server')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            source sourceSets.gametest
            property('fabric-api.gametest', 'true')
            property('fabric-api.gametest.report-file', "${project.layout.buildDirectory.get().asFile}/gametest-results.xml")
            programArg('--nogui')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('gametestClasses')
}
